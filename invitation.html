<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>You are invited | AD Soft Technologies</title>
<meta name="robots" content="noindex">
<link rel="shortcut icon" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Fredoka:wght@500;700&family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500;600&family=Great+Vibes&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#111}.msg{display:grid;place-items:center;height:100vh;padding:30px;text-align:center;font-family:'Poppins',sans-serif;color:#eee}</style>
</head>
<body>
<div id="v" class="msg">Loading invitation…</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/invitation-core.js"></script>
<script>
(async function () {
  const el = $('#v'), id = new URLSearchParams(location.search).get('id');
  try {
    if (!db || !id) throw 0;
    const s = await db.collection('invitations').doc(id).get();
    if (!s.exists) throw 0;
    el.className = ''; render(s.data(), el, false);
  } catch (e) {
    el.textContent = 'This invitation was not found. It may have expired, or the link is incomplete.';
  }
})();
</script>
</body>
</html>
