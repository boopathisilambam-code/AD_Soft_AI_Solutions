  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Digital Wedding Invitation | AD Soft Technologies</title>
  <meta name="description" content="View your personalized digital wedding invitation – animated designs with RSVP, venue maps and music. Powered by AD Soft Technologies.">
  <link rel="canonical" href="https://www.adsofttechnologies.com/invitation">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="shortcut icon" href="images/favicon.ico">

<style>
    html, body { margin: 0; height: 100%; background: #efe3c9; }
    #f { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
    #s { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
         font: 400 17px/1.6 Georgia, 'Times New Roman', serif; color: #575b41; }
    #s small { display: block; margin-top: 6px; font: 400 13px system-ui, sans-serif; color: #8a7a69; }
    .dot { width: 34px; height: 34px; margin: 0 auto 16px; border: 2px solid #cdb283; border-top-color: transparent; border-radius: 50%; animation: sp 1s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="s"><div><div class="dot"></div>Opening your invitation…</div></div>
  <iframe id="f" title="Invitation" allow="autoplay; fullscreen" hidden></iframe>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/inv-config.js?v=20261128a"></script>
  <script src="js/inv-platform.js?v=20261128a"></script>
  <script>
  (async () => {
    const P = window.InvitationPlatform;
    const state = document.getElementById('s');
    const frame = document.getElementById('f');
    const fail = (title, sub) => { state.innerHTML = `<div>${title}<small>${sub || ''}</small></div>`; };

    const id = new URLSearchParams(location.search).get('id');
    if (!id) return fail('Invitation not found', 'This link is missing its invitation id.');

    let doc;
    try { doc = await P.getInvitation(id); }
    catch (e) { console.error(e); return fail('Could not load the invitation', 'Please check your connection and try again.'); }
    if (!doc || doc.status === 'unpublished') return fail('Invitation not found', 'The link may be wrong or the invitation was removed.');

    const def = await P.loadTemplate(doc.templateId);
    if (!def) return fail('Invitation unavailable', 'Its design could not be loaded.');

    const data = P.mergeData(def.defaults, doc.data);
    document.title = (doc.title ? doc.title + ' · ' : '') + 'Wedding Invitation';
    const base = new URL('.', document.baseURI).href;

    window.addEventListener('message', async (e) => {
      if (e.source !== frame.contentWindow || e.origin !== location.origin) return;
      const m = e.data || {};
      if (m.type === 'inv:ready') {
        frame.contentWindow.postMessage({ type: 'inv:data', data, base }, location.origin);
        frame.hidden = false; state.remove();
      } else if (m.type === 'inv:rsvp') {
        let res = { type: 'inv:rsvp:result', id: m.id, ok: true };
        try { await P.saveRsvp(id, m.payload || {}); }
        catch (err) { console.error(err); res = { type: 'inv:rsvp:result', id: m.id, ok: false, error: 'Could not send your RSVP. Please try again.' }; }
        frame.contentWindow.postMessage(res, location.origin);
      }
    });
    frame.src = P.entryUrl(def) + '?embed=live';
  })();
  </script>
</body>
</html>
