<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seemantham – Baby Shower Invitation</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="register.js"></script>
<script src="inv-runtime.js"></script>
</head>
<body class="lock">
<div class="envo" id="envo"><div class="envw"><div class="half l"></div><div class="half r"></div><div class="rays"></div><div class="ring"></div><button class="gb" id="gb" aria-label="Open invitation"><i></i></button><div class="hint" id="coverHint"></div></div></div>
<div class="page">
<section class="hero" id="hero"><div class="in"><small id="eventTag"></small><div class="n"><i id="nA"></i><span>&amp;</span><i id="nB"></i></div><small id="heroLine"></small><div class="d" id="heroDate"></div></div></section>

<section id="date"><h2 id="dateTitle"></h2><div class="gold"></div><p id="dateSub"></p>
<div class="sc"><div><b id="dMain"></b><span id="dNote"></span></div><canvas id="cv"></canvas></div><div class="cd" id="cd"></div></section>

<section class="mom" id="mom"><h2 id="momTitle"></h2><div class="gold"></div><div class="mi" id="momPic"></div><p id="momText"></p></section>

<section id="events"><h2 id="evTitle"></h2><div class="gold"></div><div id="evList"></div></section>

<section class="px" id="bless"><div class="bg" data-p=".1"></div><div class="card" data-p="-.05"><h2 id="blessTitle"></h2><p id="blessText"></p></div></section>

<section class="cs" id="cradle"><h2 id="crTitle"></h2><div class="gold"></div><p id="crSub"></p>
<div class="cr" id="cr"><img class="b" id="crBase" src="" alt="Decorated cradle"><img class="s" id="crSwing" src="" alt="Baby in swinging cradle"><div class="sh"></div></div></section>

<section class="gal" id="journey"><h2 id="jTitle"></h2><div class="gold"></div><p id="jSub"></p><div class="tr" id="tr"></div></section>

<section class="game" id="game"><h2 id="gameTitle"></h2><div class="gold"></div><p id="gameSub"></p>
<div class="teams"><button class="team b" data-t="b" id="tb"></button><button class="team g" data-t="g" id="tg"></button></div>
<div class="bar"><span id="bb"></span><span id="gg"></span></div><div class="say" id="say"></div><button class="btn" id="ask"></button></section>

<section id="rsvp"><h2 id="rTitle"></h2><div class="gold"></div><p id="rSub"></p>
<form id="rf"><label>Your name<input id="rn" required autocomplete="name"></label><label>Attending<select id="ra"><option>Joyfully accepts</option><option>Regretfully declines</option></select></label><label>Number of guests<input id="rg" type="number" min="1" max="10" value="1"></label><label>Blessings for baby<textarea id="rm" rows="3"></textarea></label><button class="btn" type="submit" id="rbtn">Send RSVP</button><div class="err" id="rerr"></div></form>
<div class="thx" id="thx">Thank you! See you at the function.</div></section>

<section id="venue"><h2 id="vTitle"></h2><div class="gold"></div><p id="vText"></p>
<div class="map"><svg viewBox="0 0 64 64" width="56" height="56" fill="none" stroke="#c9a24a" stroke-width="2"><path d="M32 58S12 38 12 26a20 20 0 0 1 40 0c0 12-20 32-20 32z"/><circle cx="32" cy="26" r="7"/></svg><b id="vName"></b><span id="vAddr"></span></div>
<a class="btn" id="vLink" href="#" target="_blank" rel="noopener">Open in Google Maps</a></section>

<footer>Made with love by <a href="https://adsoftetchnologies.com" target="_blank" rel="noopener">adsoftetchnologies.com</a><div class="soc"><a href="https://www.instagram.com/adsofttechnologies?hvrq=MW12Z3lsNTJvMnV2Yw==" aria-label="Instagram" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".8"/></svg></a><a href="https://www.facebook.com/adsofttechnologies2020" aria-label="Facebook" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></svg></a></div></footer>
</div>
<div class="lb" id="lb"><div id="lbi"><p id="lbt"></p></div></div>
<script src="script.js"></script>
</body>
</html>
