<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Engagement Invitation</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="register.js"></script>
    <script src="inv-runtime.js"></script>
</head>

<body>
    <div class="bg"></div>

    <div id="cover">
        <div class="h t"></div>
        <div class="h b"></div>
        <button class="seal" id="openBtn" aria-label="Open invitation"><img src="images/feather.png" alt=""><span id="sealTxt">Open Card</span></button>
        <div class="hint" id="coverHint">Tap the seal to open</div>
    </div>

    <section id="hero">
        <div class="hc">
            <div class="bless" id="blessing"></div>
            <div class="tag" id="tagline"></div>
            <h1 class="names script" style="font-weight:400"><span id="nA"></span><br><span
                    class="amp">&amp;</span><br><span id="nB"></span></h1>
            <p class="sub" style="margin:0" id="inviteLine"></p>

        </div>
    </section>
    <section id="date">
        <h2 id="dateTitle"></h2>
        <p class="sub" id="dateSub"></p>
        <div class="scratch">
            <div class="d"><b id="dB"></b><span id="dS"></span></div><canvas id="sc" width="300"
                height="118"></canvas>
        </div>
        <small>✦ Scratch to reveal the date ✦</small>
        <div class="cd" id="cd"></div>
    </section>

    <section id="events">
        <img class="feather" src="images/feather.png" alt="">
        <h2 id="evTitle"></h2>
        <p class="sub" id="evSub"></p>
        <div id="evList"></div>
    </section>

    <section id="couple">
        <div class="stage" id="stage">
            <h2 id="coupleTitle"></h2>
            <div class="layer l-peacock" data-s="-.12"></div>
            <img class="layer l-feather" style="left:6%;top:110px" data-s=".18" src="images/feather.png" alt="">
            <img class="layer l-feather" style="right:4%;top:380px;transform:scaleX(-1)" data-s="-.22"
                src="images/feather.png" alt="">
            <div class="layer person p1" style="top:120px;margin-left:-175px" data-s=".06"><span id="pA"></span></div>
            <div class="layer person p2" style="top:215px;margin-left:5px" data-s="-.05"><span id="pB"></span></div>
            <div class="layer pn" style="top:500px" data-s=".1" id="coupleCap"></div>
        </div>
    </section>

    <section id="journey" style="padding-left:0;padding-right:0">
        <img class="feather" src="images/feather.png" alt="">
        <h2 id="jTitle"></h2>
        <p class="sub" id="jSub"></p>
        <div class="track" id="track"></div>
    </section>

    <section id="gift">
        <h2 id="gTitle"></h2>
        <p class="sub" id="gSub"></p>
        <div class="gift">
            <h3 id="gCard"></h3>
            <p id="gText"></p>
            <b id="upi"></b><br><button class="btn" id="cp">Copy UPI ID</button>
        </div>
    </section>

    <section id="rsvp">
        <h2>RSVP</h2>
        <p class="sub" id="rSub"></p>
        <div class="rs"><input id="rn" placeholder="Your name" autocomplete="name">
            <select id="rg"></select>
            <select id="ra">
                <option value="Joyfully Accepts">Joyfully attending</option>
                <option value="Regretfully Declines">Sorry, cannot attend</option>
            </select>
            <button class="btn" id="rb" style="justify-self:center">Send RSVP</button>
            <div id="rm" class="sub" style="text-align:center"></div>
        </div>
    </section>

    <section id="venue">
        <h2>Venue</h2>
        <p class="sub" id="vSub"></p>
        <iframe class="map" id="vMap" title="Venue map" loading="lazy"></iframe>
        <a class="btn" id="vLink" target="_blank" rel="noopener" href="#">Open in Google Maps</a>
    </section>

    <footer><img class="feather" style="width:30px" src="images/feather.png" alt="">
        <div id="closing"></div>
        <div class="soc"><a href="https://www.instagram.com/adsofttechnologies?hvrq=MW12Z3lsNTJvMnV2Yw==" target="_blank" rel="noopener" aria-label="Instagram"><svg
                    viewBox="0 0 24 24">
                    <path
                        d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm0 2a3 3 0 00-3 3v10a3 3 0 003 3h10a3 3 0 003-3V7a3 3 0 00-3-3H7zm5 3.5A4.5 4.5 0 1112 16.5 4.5 4.5 0 0112 7.500zm0 2A2.500 2.500 0 1012 14.500 2.500 2.500 0 0012 9.500zM17.500 6a1 1 0 110 2 1 1 0 010-2z" />
                </svg></a>
            <a href="https://www.facebook.com/adsofttechnologies2020" target="_blank" rel="noopener" aria-label="Facebook"><svg
                    viewBox="0 0 24 24">
                    <path
                        d="M13.500 22v-8.500h2.800l.5-3.400h-3.300V8c0-1 .3-1.700 1.700-1.700H17V3.300C16.700 3.300 15.700 3.200 14.500 3.200c-2.500 0-4.200 1.500-4.200 4.300v2.600H7.500v3.400h2.800V22h3.200z" />
                </svg></a>
        </div>
        <p style="margin:14px 0 0">Made with ♥ by <a href="https://adsoftechnologies.com" target="_blank"
                rel="noopener">adsoftechnologies.com</a></p>
    </footer>

    <div id="zoom">
        <div class="z" id="zc"><em></em></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
